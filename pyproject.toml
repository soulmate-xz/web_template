[tool.poetry]
name = "backend"
version = "0.1.0"
description = "python restful 接口服务"
authors = ["刘刚 <lg@qiyan.com>"]
readme = "README.md"


[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.10.6"
sqlalchemy = "^2.0.37"
alembic = "^1.14.1"
pre-commit = "^4.1.0"
fastapi = "^0.115.8"
pyjwt = "^2.10.1"
passlib = "^1.7.4"
itsdangerous = "^2.2.0"
uvicorn = "^0.34.0"
gunicorn = "^23.0.0"
aiohttp = "^3.11.12"
bcrypt = "4.0.1"
pytest = "^8.3.4"
asgi-lifespan = "^2.1.0"
httpx = "^0.28.1"
mock = "^5.1.0"
pytest-cov = "^6.0.0"
pytest-asyncio = "^0.25.3"
types-python-dateutil = "^2.9.0.20241206"
aiomysql = "^0.2.0"
sentry-sdk = "^2.20.0"
redis = "^5.2.1"
pydantic-settings = "^2.7.1"
dateparser = "^1.2.1"
types-passlib = "^1.7.7.20241221"
python-multipart = "^0.0.20"


[tool.poetry.group.dev.dependencies]
types-mock = "^5.1.0.20240425"

[tool.pytest.ini_options]
disable_test_id_escaping_and_forfeit_all_rights_to_community_support = true
asyncio_default_fixture_loop_scope = "function"
testpaths = "tests"
asyncio_mode="auto"
addopts = '''
  --strict-markers
  --tb=short
  --cov-report=term
  --cov-report=html
  --no-cov-on-fail
  --cov=backend
'''

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"



[tool.black]
line-length = 120
target-version = ['py37', 'py38']
include = '\.pyi?$'

[tool.pyright]
pythonVersion = "3.9"
include = ["backend"]

[tool.isort]
profile = "black"

[tool.mypy]
python_version = 3.11
warn_unused_ignores = false
warn_redundant_casts = false
warn_unused_configs = false
check_untyped_defs = true
disallow_untyped_defs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "migrations.*",
    "tests.*",
    "scripts.*",
]
check_untyped_defs = false
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "backend.app.routes.*",
]
check_untyped_defs = true
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = [
    "pymysql.*",
    "aiomysql.*",
    "pydomainextractor.*",
]
ignore_missing_imports = true
